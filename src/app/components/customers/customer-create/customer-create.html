
<div class="ubs-form-container">
  <div class="ubs-form-header">
    <div>
      <div class="ubs-breadcrumb">
        <a routerLink="/customers">Customers</a>
        <span>/</span>
        <span class="ubs-current">New Customer</span>
      </div>
      <h1 class="ubs-form-title">Add New Customer</h1>
    </div>
    <div class="ubs-form-actions">
      <a routerLink="/customers" class="ubs-btn-secondary">Cancel</a>
      <button type="button" (click)="saveCustomer()" class="ubs-btn-primary" [disabled]="isLoading">
        <span *ngIf="!isLoading">Save Customer</span>
        <span *ngIf="isLoading" class="ubs-saving-spinner">
          <span class="ubs-spinner"></span> Saving...
        </span>
      </button>
    </div>
  </div>

  <div class="ubs-card ubs-customer-card">
    <form (ngSubmit)="saveCustomer()" class="ubs-customer-form" novalidate>

      <!-- Customer details -->
      <section class="ubs-form-section">
        <h2 class="ubs-section-title">Customer Details</h2>
        <div class="ubs-grid-2">
          <div class="ubs-form-group">
            <label class="ubs-label" for="cust-name">Contact / Client Full Name *</label>
            <input
              id="cust-name"
              type="text"
              [(ngModel)]="customer.name"
              name="name"
              required
              autocomplete="off"
              placeholder="e.g. Rahul Sharma or Priya Patel"
              class="ubs-input"
              [class.ubs-input-invalid]="error('name')"
            />
            <small *ngIf="error('name')" class="ubs-field-error">{{ error('name') }}</small>
          </div>

          <div class="ubs-form-group">
            <label class="ubs-label" for="cust-business">Company / Organization *</label>
            <select
              id="cust-business"
              [(ngModel)]="customer.businessId"
              name="businessId"
              required
              class="ubs-select"
              [class.ubs-input-invalid]="error('businessId')"
              [disabled]="!businesses.length"
            >
              <option *ngIf="!businessesLoaded" value="">Loading your businesses…</option>
              <option *ngIf="businessesLoaded && !businesses.length" value="">No business added yet</option>
              <option *ngFor="let b of businesses" [value]="b.id">
                {{ b.name }}{{ b.gstin ? ' — ' + b.gstin : '' }}
              </option>
            </select>
            <small *ngIf="businesses.length" class="ubs-field-hint">
              <a routerLink="/settings/profile">Manage businesses</a>
            </small>
            <small *ngIf="businessesLoaded && !businesses.length" class="ubs-field-hint ubs-field-hint-warn">
              Add your business first in
              <a routerLink="/settings/profile">Profile Settings</a>.
            </small>
          </div>

          <div class="ubs-form-group">
            <label class="ubs-label" for="cust-email">Email Address{{ giveLogin ? ' *' : '' }}</label>
            <input
              id="cust-email"
              type="email"
              [(ngModel)]="customer.email"
              name="email"
              [required]="giveLogin"
              autocomplete="off"
              inputmode="email"
              placeholder="e.g. rahul.sharma@gmail.com"
              class="ubs-input"
              [class.ubs-input-invalid]="error('email')"
            />
            <small *ngIf="error('email')" class="ubs-field-error">{{ error('email') }}</small>
          </div>

          <div class="ubs-form-group">
            <label class="ubs-label" for="cust-phone">Mobile Number{{ giveLogin ? ' *' : '' }}</label>
            <input
              id="cust-phone"
              type="tel"
              [(ngModel)]="customer.phone"
              name="phone"
              [required]="giveLogin"
              autocomplete="off"
              inputmode="tel"
              maxlength="16"
              placeholder="e.g. 9876543210"
              class="ubs-input"
              [class.ubs-input-invalid]="error('phone')"
            />
            <small *ngIf="error('phone')" class="ubs-field-error">{{ error('phone') }}</small>
          </div>
        </div>
      </section>

      <!-- Tax & location -->
      <section class="ubs-form-section">
        <h2 class="ubs-section-title">Tax &amp; Location</h2>
        <div class="ubs-grid-2">
          <div class="ubs-form-group">
            <label class="ubs-label" for="cust-gstin">Buyer GSTIN <span class="ubs-optional">(optional)</span></label>
            <input
              id="cust-gstin"
              type="text"
              [ngModel]="customer.gstin"
              (ngModelChange)="onGstinChange($event)"
              name="gstin"
              maxlength="15"
              autocomplete="off"
              placeholder="e.g. 29AAACI4321A1ZG"
              class="ubs-input ubs-mono"
              [class.ubs-input-invalid]="error('gstin')"
            />
            <small *ngIf="error('gstin')" class="ubs-field-error">{{ error('gstin') }}</small>
          </div>

          <div class="ubs-form-group">
            <label class="ubs-label" for="cust-pan">PAN Number <span class="ubs-optional">(optional)</span></label>
            <input
              id="cust-pan"
              type="text"
              [ngModel]="customer.pan"
              (ngModelChange)="onPanChange($event)"
              name="pan"
              maxlength="10"
              autocomplete="off"
              placeholder="e.g. AAACI4321A"
              class="ubs-input ubs-mono"
              [class.ubs-input-invalid]="error('pan')"
            />
            <small *ngIf="error('pan')" class="ubs-field-error">{{ error('pan') }}</small>
          </div>

          <div class="ubs-form-group ubs-span-2">
            <label class="ubs-label" for="cust-state">State / Union Territory *</label>
            <select
              id="cust-state"
              [(ngModel)]="customer.stateCode"
              name="stateCode"
              required
              class="ubs-select"
              [class.ubs-input-invalid]="error('stateCode')"
            >
              <option value="" disabled>Select the customer's state</option>
              <option *ngFor="let s of states" [value]="s.code">
                {{ s.name }} ({{ s.code }})
              </option>
            </select>
            <small *ngIf="error('stateCode')" class="ubs-field-error">{{ error('stateCode') }}</small>
          </div>
        </div>

        <div class="ubs-form-group">
          <label class="ubs-label" for="cust-address">Billing Address <span class="ubs-optional">(optional)</span></label>
          <textarea
            id="cust-address"
            [(ngModel)]="customer.address"
            name="address"
            rows="3"
            placeholder="e.g. 4th Floor, HSR Layout, Bengaluru, Karnataka 560102"
            class="ubs-textarea"
          ></textarea>
        </div>
      </section>

      <!-- Login access -->
      <label class="ubs-login-check">
        <input type="checkbox" [(ngModel)]="giveLogin" name="giveLogin" />
        <span>
          <strong>Give this customer a login</strong>
          <small>Emails them a temporary password.</small>
        </span>
      </label>

      <div class="ubs-submit-row">
        <a routerLink="/customers" class="ubs-btn-secondary">Cancel</a>
        <button type="submit" class="ubs-btn-primary" [disabled]="isLoading">
          {{ isLoading ? 'Saving…' : 'Save Customer' }}
        </button>
      </div>
    </form>
  </div>
</div>

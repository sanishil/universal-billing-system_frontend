<div class="ubs-form-container">
  <div class="ubs-form-header">
    <div>
      <div class="ubs-breadcrumb">
        <a routerLink="/customers">Customers</a>
        <span>/</span>
        <span class="ubs-current">New Customer</span>
      </div>
      <h1 class="ubs-form-title">Add New Customer</h1>
      <p class="ubs-form-subtitle">Register a new client company or individual to issue invoices</p>
    </div>
    <div class="ubs-form-actions">
      <a routerLink="/customers" class="ubs-btn-secondary">Cancel</a>
      <button (click)="saveCustomer()" class="ubs-btn-primary">
        <span>Save Customer Profile</span>
      </button>
    </div>
  </div>

  <div class="ubs-card ubs-customer-card">
    <form (ngSubmit)="saveCustomer()" class="ubs-customer-form">
      <div class="ubs-grid-2">
        <div class="ubs-form-group">
          <label class="ubs-label">Contact / Client Full Name *</label>
          <input
            type="text"
            [(ngModel)]="customer.name"
            name="name"
            required
            placeholder="e.g. John Doe or Jane Smith"
            class="ubs-input"
          />
        </div>

        <div class="ubs-form-group">
          <label class="ubs-label">Company / Organization</label>
          <input
            type="text"
            [(ngModel)]="customer.company"
            name="company"
            placeholder="e.g. Acme Corporation"
            class="ubs-input"
          />
        </div>

        <div class="ubs-form-group">
          <label class="ubs-label">Work Email Address *</label>
          <input
            type="email"
            [(ngModel)]="customer.email"
            name="email"
            required
            placeholder="billing@company.com"
            class="ubs-input"
          />
        </div>

        <div class="ubs-form-group">
          <label class="ubs-label">Phone Number</label>
          <input
            type="tel"
            [(ngModel)]="customer.phone"
            name="phone"
            placeholder="+1 (555) 000-0000"
            class="ubs-input"
          />
        </div>
      </div>

      <div class="ubs-form-group">
        <label class="ubs-label">Billing Address</label>
        <textarea
          [(ngModel)]="customer.address"
          name="address"
          rows="3"
          placeholder="Street address, Suite, City, State, ZIP code..."
          class="ubs-textarea"
        ></textarea>
      </div>

      <div class="ubs-submit-row">
        <button type="submit" class="ubs-btn-primary">Save Customer & Return to List</button>
      </div>
    </form>
  </div>
</div>

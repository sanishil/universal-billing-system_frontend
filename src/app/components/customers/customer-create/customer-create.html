
<div class="ubs-form-container">
  <div class="ubs-form-header">
    <div>
      <div class="ubs-breadcrumb">
        <a routerLink="/customers">Customers</a>
        <span>/</span>
        <span class="ubs-current">New Customer</span>
      </div>
      <h1 class="ubs-form-title">Add New Customer</h1>
      <p class="ubs-form-subtitle">Register a new client company or individual to issue invoices</p>
    </div>
    <div class="ubs-form-actions">
      <a routerLink="/customers" class="ubs-btn-secondary">Cancel</a>
      <button (click)="saveCustomer()" class="ubs-btn-primary" [disabled]="isLoading">
        <span *ngIf="!isLoading">Save Customer Profile</span>
        <span *ngIf="isLoading" class="ubs-saving-spinner">
          <span class="ubs-spinner"></span> Saving...
        </span>
      </button>
    </div>
  </div>

  <div class="ubs-card ubs-customer-card">
    <form (ngSubmit)="saveCustomer()" class="ubs-customer-form">
      <div class="ubs-grid-2">
        <div class="ubs-form-group">
          <label class="ubs-label">Contact / Client Full Name *</label>
          <input
            type="text"
            [(ngModel)]="customer.name"
            name="name"
            required
            placeholder="e.g. Rahul Sharma or Priya Patel"
            class="ubs-input"
          />
        </div>

        <div class="ubs-form-group">
          <label class="ubs-label" for="cust-business">Company / Organization *</label>
          <select
            id="cust-business"
            [(ngModel)]="customer.businessId"
            name="businessId"
            required
            class="ubs-select"
            [disabled]="!businesses.length"
          >
            <option *ngIf="!businessesLoaded" value="">Loading your businesses…</option>
            <option *ngIf="businessesLoaded && !businesses.length" value="">No business added yet</option>
            <option *ngFor="let b of businesses" [value]="b.id">
              {{ b.name }}{{ b.gstin ? ' — ' + b.gstin : '' }}
            </option>
          </select>
          <small *ngIf="businesses.length" class="ubs-field-hint">
            Your business this customer is billed from.
            <a routerLink="/settings/profile">Manage businesses</a>
          </small>
          <small *ngIf="businessesLoaded && !businesses.length" class="ubs-field-hint ubs-field-hint-warn">
            Add your business first in
            <a routerLink="/settings/profile">Profile Settings</a>.
          </small>
        </div>

        <div class="ubs-form-group">
          <label class="ubs-label">Work Email Address{{ giveLogin ? ' *' : '' }}</label>
          <input
            type="email"
            [(ngModel)]="customer.email"
            name="email"
            [required]="giveLogin"
            placeholder="e.g. accounts@guptaenterprises.in"
            class="ubs-input"
          />
        </div>

        <div class="ubs-form-group">
          <label class="ubs-label">Phone Number</label>
          <input
            type="tel"
            [(ngModel)]="customer.phone"
            name="phone"
            placeholder="+91 98765 43210"
            class="ubs-input"
          />
        </div>

        <div class="ubs-form-group">
          <label class="ubs-label">Buyer GSTIN (Optional)</label>
          <input
            type="text"
            [(ngModel)]="customer.gstin"
            name="gstin"
            placeholder="e.g. 29AAACI4321A1ZG"
            class="ubs-input"
          />
        </div>

        <div class="ubs-form-group">
          <label class="ubs-label">PAN Number (Optional)</label>
          <input
            type="text"
            [(ngModel)]="customer.pan"
            name="pan"
            placeholder="e.g. AAACI4321A"
            class="ubs-input"
          />
        </div>

        <div class="ubs-form-group">
          <label class="ubs-label">State / Union Territory</label>
          <select
            [(ngModel)]="customer.state"
            name="state"
            class="ubs-select"
            (ngModelChange)="onStateChange($event)"
          >
            <option *ngFor="let s of states" [value]="s.name">
              {{ s.name }} (Code: {{ s.code }})
            </option>
          </select>
        </div>
      </div>

      <div class="ubs-form-group">
        <label class="ubs-label">Billing Address</label>
        <textarea
          [(ngModel)]="customer.address"
          name="address"
          rows="3"
          placeholder="Street address, Tech Park, City, State, PIN code (e.g. HSR Layout, Bengaluru, Karnataka 560102)"
          class="ubs-textarea"
        ></textarea>
      </div>

      <label class="ubs-login-check">
        <input type="checkbox" [(ngModel)]="giveLogin" name="giveLogin" />
        <span>
          <strong>Give this customer a login</strong>
          <small>They'll get an email to set a password, then see every bill you send them and can bill their own customers.</small>
        </span>
      </label>

      <div class="ubs-submit-row">
        <button type="submit" class="ubs-btn-primary">Save Customer & Return to List</button>
      </div>
    </form>
  </div>
</div>

<header class="ubs-header">
  <!-- Brand Logo -->
  <div class="ubs-header-brand">
    <a routerLink="/dashboard" class="ubs-logo-link">
      <div class="ubs-logo-mark">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <rect x="2" y="4" width="20" height="16" rx="3"></rect>
          <line x1="6" y1="10" x2="18" y2="10"></line>
          <line x1="6" y1="14" x2="14" y2="14"></line>
        </svg>
      </div>
      <div class="ubs-logo-text">
        <span class="ubs-brand-title">UNIVERSAL</span>
        <span class="ubs-brand-subtitle">BILLING</span>
      </div>
    </a>
  </div>

  <!-- Global Search Bar -->
  <div class="ubs-header-search">
    <div class="ubs-search-input-box">
      <svg class="ubs-search-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <circle cx="11" cy="11" r="8"></circle>
        <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
      </svg>
      <input type="text" placeholder="Search bills, customers, transactions..." class="ubs-header-search-input" />
      <span class="ubs-search-kbd">⌘K</span>
    </div>
  </div>

  <!-- Right Actions & Profile -->
  <div class="ubs-header-actions">
    <!-- Quick Create Button -->
    <a routerLink="/bills/create" class="ubs-btn-primary ubs-header-create-btn">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
        <line x1="12" y1="5" x2="12" y2="19"></line>
        <line x1="5" y1="12" x2="19" y2="12"></line>
      </svg>
      <span>New Bill</span>
    </a>

    <!-- Notification Bell -->
    <a routerLink="/notifications" class="ubs-header-icon-btn" title="Notifications">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"></path>
        <path d="M13.73 21a2 2 0 0 1-3.46 0"></path>
      </svg>
      <span class="ubs-notification-dot" *ngIf="notificationsCount > 0">{{ notificationsCount }}</span>
    </a>

    <!-- User Profile Dropdown Pill -->
    <div class="ubs-profile-pill">
      <div class="ubs-avatar">AV</div>
      <div class="ubs-user-info">
        <span class="ubs-user-name">{{ currentUser?.name || 'Administrator' }}</span>
        <span class="ubs-user-role">{{ currentUser?.role || 'Admin' }}</span>
      </div>
      <button class="ubs-logout-btn" (click)="onLogout()" title="Logout">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path>
          <polyline points="16 17 21 12 16 7"></polyline>
          <line x1="21" y1="12" x2="9" y2="12"></line>
        </svg>
      </button>
    </div>
  </div>
</header>

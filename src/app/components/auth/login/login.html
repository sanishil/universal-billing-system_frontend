<div class="yono-page-wrapper">

  <div class="yono-content-container">
    <div class="yono-grid">

      <!-- LOGIN CARD -->
      <div class="yono-right-col">
        <div class="yono-login-card">

          <!-- Card Tab Header -->
          <div class="yono-card-tab">
            <span class="yono-tab-text">Username / Password</span>
          </div>

          <!-- Error Banner -->
          <div *ngIf="errorMessage" class="yono-error-banner">
            <i class="bi bi-exclamation-circle-fill"></i>
            <span>{{ errorMessage }}</span>
          </div>

          <form [formGroup]="loginForm" (ngSubmit)="onLogin()" class="yono-form" autocomplete="off">

            <!-- Username -->
            <div class="yono-field-wrap">
              <input
                type="text"
                formControlName="username"
                class="yono-underline-input"
                placeholder="Username or Email"
              />
            </div>

            <!-- Password -->
            <div class="yono-field-wrap">
              <div class="yono-password-input-group">
                <input
                  [type]="showPassword ? 'text' : 'password'"
                  formControlName="password"
                  class="yono-underline-input"
                  placeholder="Password"
                />
                <div class="yono-field-tools">
                  <button
                    type="button"
                    class="yono-tool-btn"
                    (click)="togglePasswordVisibility()"
                    [title]="showPassword ? 'Hide password' : 'Show password'"
                  >
                    <i class="bi" [ngClass]="showPassword ? 'bi-eye-slash' : 'bi-eye'"></i>
                  </button>
                </div>
              </div>
              <div class="yono-link-row">
                <a href="javascript:void(0)" (click)="openModal('forgotPassword')" class="yono-sub-link">
                  Forgot Password?
                </a>
              </div>
            </div>

            <!-- Google reCAPTCHA v2 -->
            <div class="yono-recaptcha-wrap">
              <re-captcha
                (resolved)="onCaptchaResolved($event)">
              </re-captcha>
            </div>

            <!-- Login Button -->
            <div class="yono-submit-box">
              <button type="submit" class="yono-login-submit-btn" [disabled]="isLoading">
                <span *ngIf="!isLoading"><i class="fa-solid fa-right-to-bracket"></i> Login</span>
                <span *ngIf="isLoading" class="yono-spinner-wrap">
                  <span class="spinner-border spinner-border-sm" role="status"></span>
                </span>
              </button>
            </div>

            <!-- Register Prompt -->
            <div class="yono-register-prompt">
              <span>Don't have an account?</span>
              <a routerLink="/register" class="yono-register-link">Register Now</a>
            </div>

          </form>
        </div>
      </div>
    </div>
  </div>

  <!-- FORGOT PASSWORD MODAL -->
  <div *ngIf="activeModal" class="yono-modal-backdrop" (click)="closeModal()">
    <div class="yono-modal-card" (click)="$event.stopPropagation()">
      <div class="yono-modal-header">
        <h3 class="yono-modal-title">Reset Security Password</h3>
        <button type="button" class="yono-modal-close" (click)="closeModal()">
          <i class="bi bi-x-lg"></i>
        </button>
      </div>

      <div class="yono-modal-body">
        <div *ngIf="modalSuccessMsg" class="yono-modal-success">
          <i class="bi bi-check-circle-fill"></i>
          <span>{{ modalSuccessMsg }}</span>
        </div>

        <p *ngIf="!modalSuccessMsg" class="yono-modal-desc">
          Provide your user ID or work email. A temporary secure reset token will be dispatched.
        </p>

        <div *ngIf="!modalSuccessMsg" class="yono-modal-form">
          <div class="yono-field-wrap">
            <label class="yono-modal-label">User Identifier / Email</label>
            <input
              type="text"
              [(ngModel)]="modalEmail"
              name="modalEmail"
              placeholder="e.g. alex@universalbilling.io"
              class="yono-underline-input"
            />
          </div>
          <button type="button" class="yono-btn-modal-submit" (click)="submitModalAction()">
            Submit Request
          </button>
        </div>
      </div>
    </div>
  </div>

</div>

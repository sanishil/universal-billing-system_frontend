<div class="yono-page-wrapper">

  <!-- Toast Flash Notification -->
  <div
    *ngIf="toastVisible"
    class="yono-toast"
    [class.yono-toast--exit]="toastExiting"
    role="alert"
    aria-live="assertive">
    <i class="bi bi-exclamation-circle-fill yono-toast__icon"></i>
    <span class="yono-toast__msg">{{ toastMessage }}</span>
    <button type="button" class="yono-toast__close" (click)="dismissToast()" aria-label="Dismiss">
      <i class="bi bi-x-lg"></i>
    </button>
  </div>

  <div class="yono-content-container">
    <div class="yono-grid">
      <div class="yono-right-col">
        <div class="yono-register-card">

          <!-- Card Header -->
          <div class="yono-card-head">
            <div class="yono-card-icon"><i class="bi bi-person-plus"></i></div>
            <h1 class="yono-card-title">Create your account</h1>
            <p class="yono-card-subtitle">Get started with Universal Billing</p>
          </div>

          <form [formGroup]="registerForm" (ngSubmit)="onRegister()" class="yono-form" autocomplete="off">

            <!-- Full Name -->
            <div class="yono-field-wrap">
              <label class="yono-field-label" for="reg-name">Full name</label>
              <div class="yono-input-group">
                <i class="bi bi-person yono-input-icon"></i>
                <input id="reg-name"
                  formControlName="name"
                  type="text"
                  class="yono-underline-input"
                  (input)="dismissToast()"
                />
              </div>
            </div>

            <!-- Work Email -->
            <div class="yono-field-wrap">
              <label class="yono-field-label" for="reg-email">Email</label>
              <div class="yono-input-group">
                <i class="bi bi-envelope yono-input-icon"></i>
                <input id="reg-email"
                  formControlName="email"
                  type="email"
                  class="yono-underline-input"
                  (input)="dismissToast()"
                />
              </div>
            </div>

            <!-- Phone Number -->
            <div class="yono-field-wrap">
              <label class="yono-field-label" for="reg-phone">Mobile number</label>
              <div class="yono-input-group">
                <i class="bi bi-telephone yono-input-icon"></i>
                <input id="reg-phone"
                  formControlName="phone"
                  appMobileInput
                  class="yono-underline-input"
                  (input)="dismissToast()"
                />
              </div>
            </div>

            <!-- Google reCAPTCHA v2 -->
            <div class="yono-recaptcha-wrap">
              <div class="yono-captcha-scaler">
                <re-captcha
                  #captchaRef
                  (resolved)="onCaptchaResolved($event)">
                </re-captcha>
              </div>
              <div class="yono-captcha-refresh-row">
                <button type="button" class="yono-captcha-refresh-btn" (click)="resetCaptcha()" title="Refresh Captcha">
                  <i class="bi bi-arrow-clockwise"></i> Refresh
                </button>
              </div>
            </div>

            <!-- Submit Button -->
            <div class="yono-submit-box">
              <button type="submit" class="yono-register-submit-btn" [disabled]="isLoading">
                <span *ngIf="!isLoading">
                  <i class="fa-solid fa-user-check"></i> Register Now
                </span>
                <span *ngIf="isLoading" class="yono-spinner-wrap">
                  <span class="spinner-border spinner-border-sm" role="status"></span>
                </span>
              </button>
            </div>

          </form>

          <!-- Footer sign-in prompt -->
          <div class="yono-register-prompt">
            <span>Already have an account?</span>
            <a routerLink="/login" class="yono-register-link">Sign In</a>
          </div>

        </div>
      </div>
    </div>
  </div>

</div>

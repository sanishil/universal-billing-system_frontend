<div class="ubs-success-page">
  <div class="ubs-card ubs-success-card">
    <div class="ubs-check-ring">
      <svg width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
        <polyline points="20 6 9 17 4 12"></polyline>
      </svg>
    </div>

    <h1 class="ubs-success-title">Settlement Successful</h1>
    <p class="ubs-success-desc">The invoice has been verified and settled in full. A digital receipt has been dispatched to the client.</p>

    <div class="ubs-success-receipt-box">
      <div class="ubs-receipt-row">
        <span>Transaction ID</span>
        <span class="ubs-receipt-val">{{ transactionId }}</span>
      </div>
      <div class="ubs-receipt-row">
        <span>Timestamp</span>
        <span class="ubs-receipt-val">{{ processedDate }}</span>
      </div>
      <div class="ubs-receipt-row">
        <span>Payment Method</span>
        <span class="ubs-receipt-val">Electronic Authorization</span>
      </div>
      <div class="ubs-receipt-row">
        <span>Ledger Status</span>
        <span class="ubs-badge ubs-badge-paid">CLEARED</span>
      </div>
    </div>

    <div class="ubs-success-actions">
      <a routerLink="/dashboard" class="ubs-btn-primary">
        Return to Dashboard
      </a>
      <a routerLink="/payments" class="ubs-btn-secondary">
        Payment Ledger
      </a>
    </div>
  </div>
</div>

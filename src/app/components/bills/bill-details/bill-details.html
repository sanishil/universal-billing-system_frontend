<div class="ubs-page-container" *ngIf="bill">
  <div class="ubs-page-header">
    <div>
      <div class="ubs-breadcrumb">
        <a routerLink="/bills">Bills</a>
        <span>/</span>
        <span class="ubs-current">Details #{{ bill.id }}</span>
      </div>
      <h1 class="ubs-page-title">Invoice Audit & Details</h1>
    </div>
    <div class="ubs-page-actions">
      <a [routerLink]="['/bills/view', bill.id]" class="ubs-btn-primary"> Full Printable Sheet </a>
      <a [routerLink]="['/bills/edit', bill.id]" class="ubs-btn-secondary"> Edit </a>
    </div>
  </div>

  <div class="ubs-card ubs-details-card">
    <div class="ubs-details-grid">
      <div class="ubs-details-item">
        <span class="ubs-label">Invoice ID</span>
        <span class="ubs-value-id">#{{ bill.id }}</span>
      </div>
      <div class="ubs-details-item">
        <span class="ubs-label">Client Organization</span>
        <span class="ubs-value-bold">{{ bill.customerName }}</span>
      </div>
      <div class="ubs-details-item">
        <span class="ubs-label">Status</span>
        <div>
          <span
            class="ubs-badge"
            [ngClass]="{
              'ubs-badge-paid': bill.status === 'PAID',
              'ubs-badge-pending': bill.status === 'PENDING',
              'ubs-badge-overdue': bill.status === 'OVERDUE',
            }"
          >
            {{ bill.status }}
          </span>
        </div>
      </div>
      <div class="ubs-details-item">
        <span class="ubs-label">Total Amount</span>
        <span class="ubs-value-amount">${{ bill.total | number: '1.2-2' }}</span>
      </div>
    </div>
  </div>
</div>

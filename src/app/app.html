<div class="ubs-app-container">
  <!-- Authenticated Shell Layout -->
  <ng-container *ngIf="!hideLayout">
    <app-header></app-header>
    <div
      class="ubs-workspace-layout"
      [ngClass]="{
        'sidebar-collapsed': isSidebarCollapsed,
        'sidebar-mobile-open': isMobileSidebarOpen,
      }"
    >
      <!-- Mobile Drawer Backdrop -->
      <div
        class="ubs-sidebar-backdrop"
        *ngIf="isMobileSidebarOpen"
        (click)="closeMobileSidebar()"
      ></div>

      <app-sidebar></app-sidebar>
      <main class="ubs-main-content">
        <div class="ubs-content-viewport">
          <router-outlet></router-outlet>
        </div>
        <app-footer></app-footer>
      </main>
    </div>
  </ng-container>

  <!-- Fullscreen Layout for Auth & Public Views -->
  <ng-container *ngIf="hideLayout">
    <main class="ubs-fullscreen-viewport">
      <router-outlet></router-outlet>
    </main>
  </ng-container>
</div>
